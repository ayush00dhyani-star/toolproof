# Deploys main to Vercel production on every push, without relying on the
# Vercel <-> GitHub app integration (that requires a GitHub login connection on
# the owning Vercel account, which barito4762-3231 does not have).
#
# Requires repository secret VERCEL_TOKEN (Vercel dashboard -> Account Settings
# -> Tokens). Until that secret exists the job short-circuits so pushes stay
# green instead of failing — but it now raises a warning annotation and a job
# summary, because this guard hid a real outage: main advanced several commits
# while production kept serving an older build, and every run looked successful.
# A skipped deploy that reads as green is worse than a red one.
name: Deploy (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; never cancel a deploy mid-flight.
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_rplivX1vfu57PXq8eUeCikrG
  VERCEL_PROJECT_ID: prj_r4yIBvGJHrKGOnMuEpBe6CqfiuiI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for VERCEL_TOKEN
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Production was NOT deployed::VERCEL_TOKEN is not set, so every deploy step was skipped and this run still finished green. main has advanced but the live site is serving an older build."
            {
              echo "## Production was NOT deployed"
              echo ""
              echo "The \`VERCEL_TOKEN\` repository secret is not set, so this run skipped every"
              echo "deploy step and still finished green. That is a false green: main has"
              echo "advanced while \`https://toolproof-scan.vercel.app\` serves an older build."
              echo ""
              echo "Fix it by setting \`VERCEL_TOKEN\` (Vercel dashboard -> Account Settings ->"
              echo "Tokens), or deploy by hand:"
              echo ""
              echo '```'
              echo "vercel deploy . --prod -y --wait"
              echo '```'
              echo ""
              echo "\`node scripts/distribution-check.mjs\` reports the drift on its \`deploy\` lines."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install --global vercel@50.41.0

      - name: Pull Vercel project settings
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
