# Runs the app test suite on every push and PR to main.
# Branch protection requires this to be green before a merge.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: App suite (vitest)
        run: npm test

  lock-cli-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/toolproof-lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lock CLI suite (node --test)
        run: node --test

  mcp-package-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/toolproof-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: MCP package suite (node --test)
        run: node --test
