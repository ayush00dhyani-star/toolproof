# Keeps the distributed surfaces honest.
#
# On push/PR it runs the repo-only check: those invariants are deterministic
# (version topology, server.json, the mcpName the registry validates, the tool
# lists that the card and the directory both publish) and must never be red for
# an unrelated reason.
#
# The scheduled run does the full check, including the live endpoints and
# deploy drift. Deploy drift can only be compared once a production deploy has
# landed, so running it on push would race the Deploy workflow and produce
# misleading failures — a daily pass is the honest cadence for it.
name: Distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:17 UTC daily — off the hour so it does not pile onto peak minutes.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    name: Distribution consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repo-only consistency
        # Always run this: it is the part that must hold on every commit.
        run: node scripts/distribution-check.mjs --offline

      - name: Full check (live service, npm, deploy drift)
        # Only when a deploy has had time to land, or on demand.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Advisory on the schedule: an undeployed artifact or a pending npm
        # release is reported, not silently red. Promote it to blocking once a
        # release has settled.
        continue-on-error: true
        run: node scripts/distribution-check.mjs